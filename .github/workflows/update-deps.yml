name: Update dependencies

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Capture outdated report
        id: outdated
        run: |
          {
            echo 'report<<EOF'
            bun outdated || true
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Update dependencies
        run: bun update

      - name: Verify lockfile version ranges
        run: |
          if grep -q '"latest"' bun.lock; then
            echo 'bun.lock contains "latest" tags instead of semver ranges'
            exit 1
          fi

      - name: Close older dependency update PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,headRefName,labels,title \
            --jq '.[] | select(
              .headRefName == "chore/update-dependencies"
              or (
                ([.labels[].name] | index("dependencies")) != null
                and (.title | test("^chore\\(main\\): Update dependencies$"))
              )
            ) | .number' \
          | sort -u \
          | while read -r pr_number; do
              [ -n "$pr_number" ] || continue
              echo "Closing PR #$pr_number"
              gh pr close "$pr_number" \
                --comment "Superseded by a newer automated dependency update." \
                --delete-branch || true
            done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          branch: chore/update-dependencies
          delete-branch: true
          commit-message: "chore(main): Update dependencies"
          title: "chore(main): Update dependencies"
          body: |
            Automated dependency update via `bun update`.

            <details><summary><code>bun outdated</code> before update</summary>

            ```
            ${{ steps.outdated.outputs.report }}
            ```
            </details>
          labels: dependencies
