name: E2E Full

on:
  deployment_status:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-full-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  regression:
    name: regression
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || 'https://paulgeorge.dev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Preflight deployment access
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || 'https://paulgeorge.dev' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          HEADERS=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADERS+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
            HEADERS+=(-H "x-vercel-set-bypass-cookie: true")
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HEADERS[@]}" "${PLAYWRIGHT_BASE_URL}/")
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "::error::Deployment returned HTTP ${STATUS}. Vercel Deployment Protection is blocking CI."
            if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              echo "::error::Add VERCEL_AUTOMATION_BYPASS_SECRET to GitHub repository secrets (Vercel → Project Settings → Deployment Protection → Protection Bypass for Automation)."
            else
              echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is set but access was still denied. Verify it matches the value in Vercel."
            fi
            exit 1
          fi
      - name: Run full regression suite
        run: bun run test:e2e
        env:
          CI: true
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7
